# vim: ft=tmux
# Define color palette
set-option -g @c-base-100 "#{@c-primary-bg}"
set-option -g @c-base-content "#{@c-primary-fg}"
set-option -g @c-base-content-bold "#{@c-normal-white}"
set-option -g @c-primary "#{@c-normal-blue}"
set-option -g @c-primary-content "#{@c-normal-black}"
set-option -g @c-neutral "#{@c-bright-black}"
set-option -g @c-neutral-content "#{@c-normal-black}"
set-option -g @c-info "#{@c-normal-cyan}"
set-option -g @c-info-content "#{@c-normal-black}"

# Status line style
set-option -g status "on"
set-option -g status-interval 1
set-option -g status-justify "left"
set-option -g -u status-left-style
set-option -g status-left-length "100"
set-option -g -u status-right-style
set-option -g status-right-length "100"
set-option -g status-style "bg=#{@c-base-100}"
set-option -g status-left '#( \
  label="#{session_name}"; \
  bg="#{@c-base-100}"; \
  color="#{@c-neutral}"; \
  text_fg="#{@c-neutral-content}"; \
  echo "#[bg=$color,fg=$text_fg] $label #[bg=$bg,fg=$color] "; \
)'
set-option -g status-right '#( \
  label="%m月%d日(%a) %H:%M"; \
  bg="#{@c-base-100}"; \
  color="#{@c-neutral}"; \
  text_fg="#{@c-neutral-content}"; \
  echo "#[bg=$bg,fg=$color]#[bg=$color,fg=$text_fg] $label #[bg=$bg,fg=$color]"; \
)'

# Window title style
set-option -gw window-status-separator ""
set-option -gw window-status-bell-style "bold"
set-option -gw window-status-format '#( \
  label="#{window_name}"; \
  bg="#{@c-base-100}"; \
  color="#{@c-neutral}"; \
  text_fg="#{@c-base-content}"; \
  if ["#{window_bell_flag}" = "1" ]; then \
    label="󱅫 #{window_name}"; \
    color="#{@c-info}"; \
    text_fg="#{@c-info-content}"; \
  fi; \
  echo "#[bg=$bg,fg=$color]#[bg=$bg,fg=$text_fg] $label #[bg=$bg,fg=$color]"; \
)'
set-option -gw window-status-current-format '#( \
  label="#{window_name}"; \
  bg="#{@c-base-100}"; \
  color="#{@c-primary}"; \
  text_fg="#{@c-primary-content}"; \
  echo "#[bg=$bg,fg=$color]#[bg=$color,fg=$text_fg,bold] $label #[bg=$bg,fg=$color]"; \
)'

# Pane border style
set-option -g pane-border-style "fg=#{@c-base-content}"
set-option -g pane-active-border-style "fg=#{@c-primary}"

# Message text style
set-option -g message-style "fg=#{@c-info-content},bg=#{@c-info}"
set-option -g message-command-style "fg=#{@c-info-content},bg=#{@c-info}"

